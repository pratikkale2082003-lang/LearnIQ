spring.application.name=LearnIQ_Project



#spring.mvc.view.prefix=/WEB-INF/pages/
#spring.mvc.view.suffix=.jsp
#
#spring.web.resources.static-locations=classpath:/static/
#spring.mvc.static-path-pattern=/resources/**


server.port=8086


# Database connection URL
spring.datasource.url=jdbc:postgresql://localhost:5432/LearnIQ

# Database username
spring.datasource.username=postgres

# Database password
spring.datasource.password=${DB_PASSWORD:7733}

# PostgreSQL JDBC driver class name
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate dialect for PostgreSQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Hibernate DDL auto-update setting (e.g., update, create, create-drop, validate, none)
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true

# ===== JWT =====
# JWT_SECRET environment variable is REQUIRED (min 32 chars). No default on purpose,
# because a secret written in this file can be read by anyone who gets the project.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-hours=8

# Frontend origins allowed to call the API (comma separated)
app.cors.origins=http://localhost:5000,http://127.0.0.1:5000

# ===== Mail (OTP) =====
# Gmail: turn on 2-Step Verification, then create an "App password" (16 chars). Use it as MAIL_PASSWORD.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===== OTP =====
app.otp.expiry-minutes=10
app.otp.resend-seconds=60
app.otp.max-attempts=5
# true = also print the OTP in the console (ONLY for testing without mail; keep false otherwise)
app.otp.dev-log=false